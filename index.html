    }

    p {

    }

    .ok {
      margin-top: 25px;
      padding: 15px;
      border-radius: 12px;
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Scadenze Don Tonino</h1>
